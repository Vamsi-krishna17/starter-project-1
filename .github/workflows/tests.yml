name: tests

on:
  pull_request:
  push:
    branches: [main, "feature/**"]

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      # The tests use fakes: no Azure key, no database and no .env are needed.
      - run: pytest -q