services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: PostGres
      POSTGRES_DB: orders
    ports:
      - "5433:5432"        # use "5433:5432" if 5432 is already taken
    volumes:
      - ./01_seed.sql:/docker-entrypoint-initdb.d/01_seed.sql:ro
      - ./02_sp2_seed.sql:/docker-entrypoint-initdb.d/02_sp2_seed.sql:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d orders"]
      interval: 3s
      timeout: 3s
      retries: 10

  app:
    build: .
    env_file: .env           # Azure settings come from .env, never from the image
    environment:
      DATABASE_URL: postgresql://postgres:PostGres@db:5432/orders
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
